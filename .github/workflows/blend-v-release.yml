name: Release

on:
  push:
    tags:
      - "blend-v**[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
          - target: x86_64-apple-darwin
            runner: macos-26-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache: false
          targets: ${{ matrix.target }}

      - name: Test Linux target
        if: runner.os == 'Linux'
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Validate Linux release binary
        if: runner.os == 'Linux'
        run: |
          BINARY="target/${{ matrix.target }}/release/blend"
          "$BINARY" --version
          "$BINARY" --sandbox force --blend-dir tests/fixtures check toml-basic

      - name: Package archive
        shell: bash
        run: |
          ARCHIVE_DIR="blend-${{ matrix.target }}"
          mkdir "$ARCHIVE_DIR"
          cp "target/${{ matrix.target }}/release/blend" "$ARCHIVE_DIR/"
          cp README.md CHANGELOG.md LICENSE "$ARCHIVE_DIR/"
          tar cJf "${ARCHIVE_DIR}.tar.xz" "$ARCHIVE_DIR"
          sha256sum "${ARCHIVE_DIR}.tar.xz" > "${ARCHIVE_DIR}.tar.xz.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "blend-${{ matrix.target }}.tar.xz"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            blend-${{ matrix.target }}.tar.xz
            blend-${{ matrix.target }}.tar.xz.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd artifacts
          cat *.sha256 > sha256.sum

      - name: Generate installer
        run: |
          VERSION="${GITHUB_REF_NAME#blend-v}"

          cp .github/install_template.sh artifacts/blend-installer.sh

          sed -i "s/__APP_VERSION__/${VERSION}/" artifacts/blend-installer.sh

          for target in aarch64-apple-darwin aarch64-unknown-linux-gnu x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            CHECKSUM=$(grep "blend-${target}.tar.xz" artifacts/sha256.sum | cut -d' ' -f1)
            PLACEHOLDER="__CHECKSUM_$(echo "$target" | tr '[:lower:]-' '[:upper:]_')__"
            sed -i "s/${PLACEHOLDER}/${CHECKSUM}/" artifacts/blend-installer.sh
          done

          chmod +x artifacts/blend-installer.sh

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#blend-v}"

          # Extract the section for this version from CHANGELOG.md
          # Starts after "## [x.y.z]" heading, stops at next "## " heading
          NOTES=$(awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if (index($0, "[" ver "]")) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release blend v${VERSION}"
          fi

          # Write to file to avoid quoting issues
          echo "$NOTES" > "$RUNNER_TEMP/release-notes.txt"

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#blend-v}"

          # Detect prerelease
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *-*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "blend v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            $PRERELEASE_FLAG \
            artifacts/blend-*.tar.xz \
            artifacts/blend-*.tar.xz.sha256 \
            artifacts/sha256.sum \
            artifacts/blend-installer.sh

  docker:
    name: Build Docker image (${{ matrix.platform }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_id: linux-amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - platform: linux/arm64
            platform_id: linux-arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      attestations: write
      id-token: write
      packages: write
    steps:
      - name: Harden the runner (Block unapproved outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.pkg.github.com:443
            api.github.com:443
            auth.docker.io:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            production.cloudfront.docker.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.target }}
          path: artifacts

      - name: Extract binary
        run: |
          tar xJf artifacts/blend-${{ matrix.target }}.tar.xz
          cp blend-${{ matrix.target }}/blend ./blend

      - name: Log in to ghcr.io
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4

      - name: Build and push image by digest
        id: build
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/blend,push-by-digest=true,name-canonical=true,push=true

      - name: Validate native image
        run: docker run --rm --platform "${{ matrix.platform }}" "ghcr.io/${{ github.repository_owner }}/blend@${{ steps.build.outputs.digest }}" --version

      - name: Attest platform image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/blend
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Export image digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publish multi-architecture Docker image
    needs: docker
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      attestations: write
      id-token: write
      packages: write
    steps:
      - name: Harden the runner (Block unapproved outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.pkg.github.com:443
            api.github.com:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443

      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Log in to ghcr.io
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4

      - name: Create multi-architecture manifest
        id: manifest
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blend
        run: |
          VERSION="${GITHUB_REF_NAME#blend-v}"
          TAGS=(--tag "${IMAGE_NAME}:${VERSION}")
          case "$VERSION" in
            *-*) ;;
            *) TAGS+=(--tag "${IMAGE_NAME}:latest") ;;
          esac

          mapfile -t DIGEST_FILES < <(find "$RUNNER_TEMP/digests" -type f | sort)
          if [ "${#DIGEST_FILES[@]}" -ne 2 ]; then
            echo "::error::Expected two platform image digests, found ${#DIGEST_FILES[@]}"
            exit 1
          fi

          IMAGES=()
          for DIGEST_FILE in "${DIGEST_FILES[@]}"; do
            IMAGES+=("${IMAGE_NAME}@sha256:$(basename "$DIGEST_FILE")")
          done

          docker buildx imagetools create "${TAGS[@]}" "${IMAGES[@]}"

          INSPECTION="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}")"
          printf '%s\n' "$INSPECTION"
          printf '%s\n' "$INSPECTION" | grep -q 'linux/amd64'
          printf '%s\n' "$INSPECTION" | grep -q 'linux/arm64'

          DIGEST="$(printf '%s\n' "$INSPECTION" | awk '$1 == "Digest:" { print $2; exit }')"
          case "$DIGEST" in
            sha256:*) ;;
            *)
              echo "::error::Could not determine manifest digest"
              exit 1
              ;;
          esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest multi-architecture image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/blend
          subject-digest: ${{ steps.manifest.outputs.digest }}

  notify-tap:
    name: Notify Homebrew tap
    needs: [release, docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check if prerelease
        id: check
        run: |
          VERSION="${GITHUB_REF_NAME#blend-v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create app token for homebrew-tap
        if: steps.check.outputs.prerelease == 'false'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          permission-contents: write

      - name: Dispatch formula update
        if: steps.check.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#blend-v}"

          gh api \
            --method POST \
            "/repos/${{ github.repository_owner }}/homebrew-tap/dispatches" \
            -f event_type="update-formula" \
            -f "client_payload[formula]=blend" \
            -f "client_payload[version]=$VERSION"

          echo "::notice::Dispatched formula update for blend v${VERSION} to homebrew-tap"
