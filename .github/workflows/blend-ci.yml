name: Blend CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/blend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/blend-ci.yml"

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden the runner (Block unapproved outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.blob.core.windows.net:443
            index.crates.io:443
            results-receiver.actions.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          cache: false
          components: rustfmt, clippy
      - uses: step-security/rust-cache@8871c8ba063416da7c32246932ea6ae08700453e # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - name: Build integration-test binary
        if: runner.os == 'Linux'
        run: cargo build --locked
      - name: Upload integration-test binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blend-linux-x86_64
          path: |
            target/debug/blend
            tests/fixtures/orders/order.contract.ncl
            tests/fixtures/orders/metadata.ncl
          if-no-files-found: error
          retention-days: 1

  vanilla-integration:
    name: Vanilla integration
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Block unapproved outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            *.blob.core.windows.net:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout Vanilla default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: frantic1048/Vanilla
          path: vanilla
          fetch-depth: 1
          persist-credentials: false

      - name: Download current Blend
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blend-linux-x86_64
          path: integration

      - name: Make Blend executable
        run: chmod +x integration/target/debug/blend

      - name: Report Vanilla revision
        run: git -C vanilla rev-parse HEAD

      - name: Refresh Blend-managed Vanilla files
        run: cp integration/tests/fixtures/orders/{order.contract.ncl,metadata.ncl} vanilla/orders/

      - name: Validate Vanilla Orders
        run: ./integration/target/debug/blend --blend-dir vanilla check

      - name: Check Vanilla Order formatting
        run: ./integration/target/debug/blend --blend-dir vanilla format --check
