[changelog]
header = """# Changelog

All notable changes to blend will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

## [Unreleased]

"""
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{# Merge commits integrate existing changes; list their constituent commits instead. #}
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
{%- if commit.scope -%}
- *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}{%- if commit.links %} ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%}){% endif %}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% endfor -%}
{% endfor %}
"""
trim = true

[git]
tag_pattern = "blend-v[0-9].*"
# Allow non-conventional commit messages to pass through to commit_parsers
# so the catch-all parser can pick them up instead of silently dropping them.
filter_unconventional = false
commit_preprocessors = [
  { pattern = "\\(#([0-9]+)\\)", replace = "([#${1}](https://github.com/frantic1048/blend/pull/${1}))" },
]
commit_parsers = [
  # Keep routine automation and dependency maintenance out of user-facing
  # release notes. Use a footer for other intentionally invisible changes.
  { footer = "^changelog: ?ignore", skip = true },
  { message = "^ci(?:\\([^)]*\\))?[!:]", skip = true },
  { message = "^chore\\(release\\)[!:]", skip = true },
  { message = "^(?:build|chore)\\(deps(?:-dev)?\\)[!:]", skip = true },
  # Website-only changes; scope them as e.g. `feat(website): ...`.
  { message = "^\\w+\\(website\\)[!:]", skip = true },
  # feat: add project website (predates the website scope convention).
  { sha = "9878cd16ceaca58d4a0f8c1d0609d8c011904443", skip = true },
  { message = "^feat", group = "added" },
  { message = "^changed", group = "changed" },
  { message = "^deprecated", group = "deprecated" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = "^.*", group = "other" },
]
